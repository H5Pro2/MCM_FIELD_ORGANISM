<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
  <title id="title">Schaltplan der aktuellen MCM Field Organism Mechanik</title>
  <desc id="desc">Drei vollständig getrennte Sinnespfade führen jeweils über eigene Rezeptoren und ein eigenes MCM-Feld zu eigenen Feldfenstern. Erst danach führt der neutrale Verteiler die unterscheidbaren Feldfenster zeitlich zusammen. Darunter ist der Innenaufbau genau einer Feldinstanz vergrößert.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1c2738"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1c2738; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #556378; }
      .section { font-size: 21px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #556378; }
      .small { font-size: 12px; fill: #556378; }
      .flow { stroke: #1c2738; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wire { stroke: #1c2738; stroke-width: 3; fill: none; }
      .open { stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1920" height="1280" fill="#f7f9fc"/>
  <rect width="1920" height="8" fill="#16837a"/>
  <text x="55" y="62" class="title">MCM_FIELD_ORGANISM · aktueller Mechanikschaltplan</text>
  <text x="55" y="96" class="subtitle">Getrennte Sinnesfelder · Neuronen innerhalb jedes Feldes · Zusammenführung erst nach vollständigem Feldexport</text>

  <!-- Main pipeline -->
  <rect x="50" y="135" width="1820" height="405" rx="8" fill="#ffffff" stroke="#c9d2df" stroke-width="3"/>
  <text x="80" y="174" class="section">1 · Drei getrennte sensorspezifische Pfade</text>

  <text x="105" y="207" class="small">WELTKONTAKT</text>
  <text x="290" y="207" class="small">REZEPTORFLÄCHE</text>
  <text x="530" y="207" class="small">EIGENES MCM-FELD</text>
  <text x="870" y="207" class="small">VOLLSTÄNDIGES FELDFENSTER</text>
  <text x="1140" y="207" class="small">ERST HIER ZUSAMMENFÜHRUNG</text>

  <!-- Auditory lane -->
  <rect x="85" y="230" width="145" height="78" rx="6" fill="#e9f7f5" stroke="#16837a" stroke-width="3"/>
  <text x="157" y="260" text-anchor="middle" class="label">Mikrofon</text>
  <text x="157" y="285" text-anchor="middle" class="body">Audio-In aktiv</text>
  <line x1="230" y1="269" x2="275" y2="269" class="flow"/>
  <rect x="285" y="220" width="175" height="98" rx="6" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <text x="372" y="251" text-anchor="middle" class="label">auditive Rezeptoren</text>
  <text x="372" y="278" text-anchor="middle" class="body">48 lokale Frequenzträger</text>
  <text x="372" y="299" text-anchor="middle" class="small">eigene Audiozeit</text>
  <line x1="460" y1="269" x2="505" y2="269" class="flow"/>
  <rect x="515" y="220" width="285" height="98" rx="6" fill="#eaf2fb" stroke="#3478b8" stroke-width="3"/>
  <text x="657" y="251" text-anchor="middle" class="label">auditives MCM-Feld</text>
  <text x="657" y="278" text-anchor="middle" class="body">eigene Neuronenschicht</text>
  <text x="657" y="299" text-anchor="middle" class="small">1:1-Dockbaseline · 48 Positionen</text>
  <line x1="800" y1="269" x2="845" y2="269" class="flow"/>
  <rect x="855" y="230" width="205" height="78" rx="6" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="957" y="260" text-anchor="middle" class="label">auditives Feldfenster</text>
  <text x="957" y="285" text-anchor="middle" class="small">vollständige Feldlage</text>

  <!-- Visual lane -->
  <rect x="85" y="335" width="145" height="78" rx="6" fill="#fff4dc" stroke="#d79524" stroke-width="3"/>
  <text x="157" y="365" text-anchor="middle" class="label">Kamera</text>
  <text x="157" y="390" text-anchor="middle" class="body">Quelle noch offen</text>
  <line x1="230" y1="374" x2="275" y2="374" class="flow"/>
  <rect x="285" y="325" width="175" height="98" rx="6" fill="#ffffff" stroke="#d79524" stroke-width="3"/>
  <text x="372" y="356" text-anchor="middle" class="label">visuelle Rezeptoren</text>
  <text x="372" y="383" text-anchor="middle" class="body">12 × 8 × 3 Träger</text>
  <text x="372" y="404" text-anchor="middle" class="small">synthetisch geprüft</text>
  <line x1="460" y1="374" x2="505" y2="374" class="flow"/>
  <rect x="515" y="325" width="285" height="98" rx="6" fill="#fff5e8" stroke="#d79524" stroke-width="3"/>
  <text x="657" y="356" text-anchor="middle" class="label">visuelles MCM-Feld</text>
  <text x="657" y="383" text-anchor="middle" class="body">eigene Neuronenschicht</text>
  <text x="657" y="404" text-anchor="middle" class="small">1:1-Dockbaseline · 288 Positionen</text>
  <line x1="800" y1="374" x2="845" y2="374" class="flow"/>
  <rect x="855" y="335" width="205" height="78" rx="6" fill="#fff5e8" stroke="#d79524" stroke-width="3"/>
  <text x="957" y="365" text-anchor="middle" class="label">visuelles Feldfenster</text>
  <text x="957" y="390" text-anchor="middle" class="small">synthetisch vollständig</text>

  <!-- Tactile lane -->
  <rect x="85" y="440" width="145" height="65" rx="6" fill="#f4eafa" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="157" y="466" text-anchor="middle" class="label">Sensor</text>
  <text x="157" y="488" text-anchor="middle" class="body">später</text>
  <line x1="230" y1="472" x2="275" y2="472" class="flow open"/>
  <rect x="285" y="430" width="175" height="85" rx="6" fill="#ffffff" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="372" y="461" text-anchor="middle" class="label">taktile Rezeptoren</text>
  <text x="372" y="488" text-anchor="middle" class="small">Geometrie offen</text>
  <line x1="460" y1="472" x2="505" y2="472" class="flow open"/>
  <rect x="515" y="430" width="285" height="85" rx="6" fill="#f4eafa" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="657" y="461" text-anchor="middle" class="label">taktiles MCM-Feld</text>
  <text x="657" y="488" text-anchor="middle" class="small">generische Hülle vorbereitet</text>
  <line x1="800" y1="472" x2="845" y2="472" class="flow open"/>
  <rect x="855" y="440" width="205" height="65" rx="6" fill="#f4eafa" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="957" y="466" text-anchor="middle" class="label">taktiles Feldfenster</text>
  <text x="957" y="488" text-anchor="middle" class="small">später</text>

  <!-- Clean field-window bus -->
  <path d="M1060 269H1090V472" class="wire"/>
  <path d="M1060 374H1090" class="wire"/>
  <path d="M1060 472H1090" class="wire open"/>
  <line x1="1090" y1="374" x2="1130" y2="374" class="flow"/>
  <rect x="1140" y="260" width="190" height="225" rx="7" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="1235" y="301" text-anchor="middle" class="label">MCM-Verteiler</text>
  <text x="1235" y="338" text-anchor="middle" class="body">gemeinsame Feldzeit</text>
  <text x="1235" y="368" text-anchor="middle" class="body">verlustfreie Übergabe</text>
  <text x="1235" y="398" text-anchor="middle" class="body">keine harte Fusion</text>
  <text x="1235" y="428" text-anchor="middle" class="body">keine Neuronen</text>
  <text x="1235" y="458" text-anchor="middle" class="body">kein zentrales Memory</text>
  <line x1="1330" y1="374" x2="1380" y2="374" class="flow"/>
  <rect x="1390" y="275" width="425" height="198" rx="7" fill="#e9f7f5" stroke="#16837a" stroke-width="3"/>
  <text x="1602" y="315" text-anchor="middle" class="label">Multimodale Feldkonstellation</text>
  <text x="1430" y="357" class="body">auditives Muster</text>
  <text x="1430" y="387" class="body">visuelles Muster</text>
  <text x="1430" y="417" class="body">taktiles Muster später</text>
  <text x="1602" y="451" text-anchor="middle" class="small">gemeinsame Gegenwart · Herkunft bleibt erhalten</text>

  <!-- Zoom label applies to every separate field instance -->
  <text x="960" y="565" text-anchor="middle" class="small">Der folgende Innenaufbau gilt jeweils getrennt für genau eine Feldinstanz.</text>

  <!-- Expanded anatomy of one field -->
  <rect x="50" y="585" width="1820" height="500" rx="8" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <text x="80" y="625" class="section">2 · Innenaufbau eines einzelnen sensorspezifischen MCM-Feldes</text>
  <text x="80" y="654" class="body">Vergrößertes Rollenbeispiel · nicht drei Modalitäten in einem Feld · keine feste globale Neuronenzahl</text>

  <rect x="85" y="700" width="205" height="300" rx="6" fill="#fff4dc" stroke="#d79524" stroke-width="3"/>
  <text x="187" y="736" text-anchor="middle" class="label">abgeschlossene</text>
  <text x="187" y="759" text-anchor="middle" class="label">Rezeptorlage</text>
  <rect x="120" y="800" width="135" height="45" rx="5" fill="#ffffff" stroke="#d79524" stroke-width="2"/>
  <text x="187" y="829" text-anchor="middle" class="body">Rezeptor R1</text>
  <rect x="120" y="865" width="135" height="45" rx="5" fill="#ffffff" stroke="#d79524" stroke-width="2"/>
  <text x="187" y="894" text-anchor="middle" class="body">Rezeptor R2</text>
  <rect x="120" y="930" width="135" height="45" rx="5" fill="#ffffff" stroke="#d79524" stroke-width="2"/>
  <text x="187" y="959" text-anchor="middle" class="body">Rezeptor R3</text>

  <line x1="290" y1="850" x2="340" y2="850" class="flow"/>
  <rect x="350" y="700" width="185" height="300" rx="6" fill="#fff8e8" stroke="#d79524" stroke-width="3"/>
  <text x="442" y="736" text-anchor="middle" class="label">Dockkarte</text>
  <text x="442" y="763" text-anchor="middle" class="small">explizite 1:1-Baseline</text>
  <text x="385" y="820" class="body">R1 → N1</text>
  <text x="385" y="885" class="body">R2 → N2</text>
  <text x="385" y="950" class="body">R3 → N3</text>
  <text x="442" y="982" text-anchor="middle" class="small">keine Gewichte · keine Semantik</text>

  <line x1="535" y1="850" x2="585" y2="850" class="flow"/>
  <rect x="595" y="685" width="840" height="330" rx="7" fill="#eef6fb" stroke="#3478b8" stroke-width="3"/>
  <text x="625" y="723" class="label">Räumliche MCM-Neuronenschicht</text>
  <text x="625" y="749" class="small">Neuronen sitzen innerhalb dieses sensorspezifischen Feldes.</text>

  <!-- Docked neurons -->
  <rect x="630" y="790" width="165" height="78" rx="6" fill="#ffffff" stroke="#3478b8" stroke-width="3"/>
  <circle cx="654" cy="814" r="9" fill="#16837a"/>
  <text x="674" y="820" class="label">Neuron N1</text>
  <text x="650" y="843" class="small">Position x1 · Dock</text>
  <text x="650" y="860" class="small">A(t) · H(t)</text>
  <rect x="630" y="885" width="165" height="78" rx="6" fill="#ffffff" stroke="#3478b8" stroke-width="3"/>
  <circle cx="654" cy="909" r="9" fill="#16837a"/>
  <text x="674" y="915" class="label">Neuron N2</text>
  <text x="650" y="938" class="small">Position x2 · Dock</text>
  <text x="650" y="955" class="small">A(t) · H(t)</text>
  <rect x="815" y="790" width="165" height="78" rx="6" fill="#ffffff" stroke="#3478b8" stroke-width="3"/>
  <circle cx="839" cy="814" r="9" fill="#16837a"/>
  <text x="859" y="820" class="label">Neuron N3</text>
  <text x="835" y="843" class="small">Position x3 · Dock</text>
  <text x="835" y="860" class="small">A(t) · H(t)</text>

  <!-- Optional internal positions -->
  <rect x="815" y="885" width="180" height="78" rx="6" fill="#ffffff" stroke="#3478b8" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="839" cy="909" r="9" fill="#526f91"/>
  <text x="859" y="915" class="label">Neuron N4</text>
  <text x="835" y="941" class="small">mögliche innere Position</text>

  <!-- Local perception and open function -->
  <rect x="1020" y="790" width="215" height="173" rx="6" fill="#e9f7f5" stroke="#16837a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1127" y="820" text-anchor="middle" class="label">lokale Feldprobe</text>
  <text x="1040" y="852" class="small">für jedes Neuron getrennt:</text>
  <text x="1040" y="880" class="small">· positionsbezogene A(t)</text>
  <text x="1040" y="904" class="small">· positionsbezogene H(t)</text>
  <text x="1040" y="932" class="small">aus vollständigem Feld(t)</text>
  <text x="1127" y="954" text-anchor="middle" class="small">keine Neuronenkante</text>

  <rect x="1260" y="775" width="145" height="205" rx="6" fill="#fff8e8" stroke="#d79524" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1332" y="803" text-anchor="middle" class="label">lokale</text>
  <text x="1332" y="825" text-anchor="middle" class="label">Funktion F</text>
  <text x="1332" y="853" text-anchor="middle" class="small">Kontakt(t+1)</text>
  <text x="1332" y="877" text-anchor="middle" class="small">Eigenzustand(t)</text>
  <text x="1332" y="901" text-anchor="middle" class="small">Feldprobe(t)</text>
  <line x1="1280" y1="920" x2="1385" y2="920" stroke="#d79524" stroke-width="2"/>
  <text x="1332" y="945" text-anchor="middle" class="small">A(t+1) · H(t+1)</text>
  <text x="1332" y="970" text-anchor="middle" class="small">noch keine Runtime-Regel</text>

  <line x1="1435" y1="850" x2="1490" y2="850" class="flow"/>
  <rect x="1500" y="750" width="310" height="200" rx="7" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="1655" y="787" text-anchor="middle" class="label">vollständiges Feldfenster</text>
  <text x="1530" y="827" class="body">· stabile Neuronenidentitäten</text>
  <text x="1530" y="857" class="body">· Aktivierung aller Positionen</text>
  <text x="1530" y="887" class="body">· Nachhall aller Positionen</text>
  <text x="1530" y="917" class="body">· gemeinsames Feldintervall</text>
  <text x="1655" y="972" text-anchor="middle" class="small">erst danach zum MCM-Verteiler</text>

  <!-- Atomic timing -->
  <rect x="50" y="1110" width="1820" height="110" rx="7" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="80" y="1145" class="section">3 · Atomare Feldzeit</text>
  <rect x="300" y="1130" width="250" height="65" rx="6" fill="#ffffff" stroke="#526f91" stroke-width="2"/>
  <text x="425" y="1157" text-anchor="middle" class="label">vollständiges Feld(t)</text>
  <text x="425" y="1180" text-anchor="middle" class="small">alle Neuronen aus demselben Takt</text>
  <line x1="550" y1="1162" x2="635" y2="1162" class="flow"/>
  <rect x="645" y="1130" width="300" height="65" rx="6" fill="#ffffff" stroke="#526f91" stroke-width="2"/>
  <text x="795" y="1157" text-anchor="middle" class="label">alle lokalen Vorschläge</text>
  <text x="795" y="1180" text-anchor="middle" class="small">kein Neuron sieht t+1 vorzeitig</text>
  <line x1="945" y1="1162" x2="1030" y2="1162" class="flow"/>
  <rect x="1040" y="1130" width="285" height="65" rx="6" fill="#e9f7f5" stroke="#16837a" stroke-width="3"/>
  <text x="1182" y="1157" text-anchor="middle" class="label">gemeinsamer Commit</text>
  <text x="1182" y="1180" text-anchor="middle" class="small">vollständiges Feld(t+1)</text>
  <text x="1390" y="1155" class="body">Offen bleiben:</text>
  <text x="1390" y="1182" class="small">Felddynamik · innere Topologie · Memory · Reflexion</text>

  <!-- Legend -->
  <rect x="50" y="1240" width="1820" height="28" rx="5" fill="#172033"/>
  <circle cx="85" cy="1254" r="7" fill="#16837a"/><text x="102" y="1259" class="small" fill="#ffffff">direkter Rezeptordock</text>
  <circle cx="295" cy="1254" r="7" fill="#526f91"/><text x="312" y="1259" class="small" fill="#ffffff">mögliche innere Position</text>
  <rect x="540" y="1247" width="42" height="14" rx="3" fill="none" stroke="#16837a" stroke-width="2" stroke-dasharray="7 6"/><text x="596" y="1259" class="small" fill="#ffffff">Probe oder Forschungsgrenze, keine Verbindung</text>
  <text x="1120" y="1259" class="small" fill="#ffffff">A = Aktivierung · H = Nachhall · Verteiler besitzt keine Neuronen</text>
</svg>
