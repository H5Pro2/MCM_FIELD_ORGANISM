<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1220" viewBox="0 0 1920 1220" role="img" aria-labelledby="title desc">
  <title id="title">Schaltplan der aktuellen MCM Field Organism Mechanik</title>
  <desc id="desc">Der Plan zeigt Sensoren, Rezeptorflächen, explizite Neuronendocks, räumlich angeordnete MCM-Neuronen im sensorspezifischen Feld, atomare Feldzeit, Feldfenster, neutralen Verteiler und multimodale Feldkonstellation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1c2738"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1c2738; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #556378; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #556378; }
      .small { font-size: 12px; fill: #556378; }
      .flow { stroke: #1c2738; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dock { stroke: #d79524; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wire { stroke: #1c2738; stroke-width: 3; fill: none; }
      .open { stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1920" height="1220" fill="#f7f9fc"/>
  <rect width="1920" height="8" fill="#16837a"/>
  <text x="60" y="65" class="title">MCM_FIELD_ORGANISM · Schaltplan der aktuellen Mechanik</text>
  <text x="60" y="99" class="subtitle">Wo die Neuronen sitzen, was sie erhalten und wie vollständige Sinnesfelder zusammengeführt werden</text>

  <!-- Left: world and receptor boundary -->
  <rect x="55" y="145" width="330" height="710" rx="8" fill="#ffffff" stroke="#c9d2df" stroke-width="3"/>
  <text x="85" y="185" class="section">1 · Weltkontakt und Rezeptoren</text>

  <rect x="85" y="225" width="125" height="80" rx="6" fill="#e9f7f5" stroke="#16837a" stroke-width="3"/>
  <text x="147" y="257" text-anchor="middle" class="label">Mikrofon</text>
  <text x="147" y="282" text-anchor="middle" class="body">Audio-In aktiv</text>
  <line x1="210" y1="265" x2="245" y2="265" class="flow"/>
  <rect x="255" y="215" width="100" height="100" rx="6" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <text x="305" y="246" text-anchor="middle" class="label">auditive</text>
  <text x="305" y="268" text-anchor="middle" class="label">Rezeptoren</text>
  <text x="305" y="294" text-anchor="middle" class="small">48 Träger</text>

  <rect x="85" y="365" width="125" height="80" rx="6" fill="#fff4dc" stroke="#d79524" stroke-width="3"/>
  <text x="147" y="397" text-anchor="middle" class="label">Kamera</text>
  <text x="147" y="422" text-anchor="middle" class="body">Quelle offen</text>
  <line x1="210" y1="405" x2="245" y2="405" class="flow"/>
  <rect x="255" y="355" width="100" height="100" rx="6" fill="#ffffff" stroke="#d79524" stroke-width="3"/>
  <text x="305" y="386" text-anchor="middle" class="label">visuelle</text>
  <text x="305" y="408" text-anchor="middle" class="label">Rezeptoren</text>
  <text x="305" y="434" text-anchor="middle" class="small">12×8×3 Träger</text>

  <rect x="85" y="505" width="125" height="80" rx="6" fill="#f4eafa" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="147" y="537" text-anchor="middle" class="label">Sensor</text>
  <text x="147" y="562" text-anchor="middle" class="body">später</text>
  <line x1="210" y1="545" x2="245" y2="545" class="flow open"/>
  <rect x="255" y="495" width="100" height="100" rx="6" fill="#ffffff" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="305" y="526" text-anchor="middle" class="label">taktile</text>
  <text x="305" y="548" text-anchor="middle" class="label">Rezeptoren</text>
  <text x="305" y="574" text-anchor="middle" class="small">vorbereitet</text>

  <rect x="85" y="650" width="270" height="150" rx="6" fill="#edf3fb" stroke="#526f91" stroke-width="2"/>
  <text x="105" y="683" class="label">Rezeptorgrenze</text>
  <text x="105" y="713" class="body">· technische Filter, keine Objekte</text>
  <text x="105" y="739" class="body">· eigene Sensorzeit bleibt erhalten</text>
  <text x="105" y="765" class="body">· abgeschlossene Rezeptorlage</text>

  <!-- Center: expanded field -->
  <rect x="420" y="145" width="980" height="710" rx="8" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <text x="450" y="185" class="section">2 · Ein sensorspezifisches MCM-Feld · vergrößert dargestellt</text>
  <text x="450" y="214" class="body">Diese innere Struktur existiert getrennt für Hören, Sehen und später Fühlen.</text>

  <!-- Dock map -->
  <rect x="455" y="250" width="150" height="540" rx="6" fill="#fff4dc" stroke="#d79524" stroke-width="3"/>
  <text x="530" y="284" text-anchor="middle" class="label">Dockkarte</text>
  <text x="530" y="307" text-anchor="middle" class="small">explizite 1:1 Baseline</text>
  <rect x="485" y="355" width="90" height="48" rx="5" fill="#ffffff" stroke="#d79524" stroke-width="2"/>
  <text x="530" y="385" text-anchor="middle" class="body">Rezeptor 1</text>
  <rect x="485" y="470" width="90" height="48" rx="5" fill="#ffffff" stroke="#d79524" stroke-width="2"/>
  <text x="530" y="500" text-anchor="middle" class="body">Rezeptor 2</text>
  <rect x="485" y="585" width="90" height="48" rx="5" fill="#ffffff" stroke="#d79524" stroke-width="2"/>
  <text x="530" y="615" text-anchor="middle" class="body">Rezeptor 3</text>
  <text x="530" y="700" text-anchor="middle" class="small">keine Gewichte</text>
  <text x="530" y="722" text-anchor="middle" class="small">keine Schwellen</text>
  <text x="530" y="744" text-anchor="middle" class="small">keine Semantik</text>

  <!-- Neuron field -->
  <rect x="650" y="250" width="710" height="540" rx="6" fill="#eef6fb" stroke="#3478b8" stroke-width="3"/>
  <text x="680" y="284" class="label">Räumliche MCM-Neuronenschicht</text>
  <text x="680" y="309" class="small">Beispielanordnung · keine globale feste Neuronenzahl</text>

  <!-- Dock arrows -->
  <path d="M575 379H690" class="dock"/>
  <path d="M575 494H690" class="dock"/>
  <path d="M575 609H690" class="dock"/>

  <!-- Neurons -->
  <g>
    <rect x="705" y="335" width="155" height="92" rx="7" fill="#ffffff" stroke="#3478b8" stroke-width="3"/>
    <circle cx="730" cy="359" r="9" fill="#16837a"/>
    <text x="750" y="365" class="label">Neuron N1</text>
    <text x="725" y="390" class="small">Position x1 · Dock</text>
    <text x="725" y="411" class="small">A(t) · H(t)</text>

    <rect x="705" y="450" width="155" height="92" rx="7" fill="#ffffff" stroke="#3478b8" stroke-width="3"/>
    <circle cx="730" cy="474" r="9" fill="#16837a"/>
    <text x="750" y="480" class="label">Neuron N2</text>
    <text x="725" y="505" class="small">Position x2 · Dock</text>
    <text x="725" y="526" class="small">A(t) · H(t)</text>

    <rect x="705" y="565" width="155" height="92" rx="7" fill="#ffffff" stroke="#3478b8" stroke-width="3"/>
    <circle cx="730" cy="589" r="9" fill="#16837a"/>
    <text x="750" y="595" class="label">Neuron N3</text>
    <text x="725" y="620" class="small">Position x3 · Dock</text>
    <text x="725" y="641" class="small">A(t) · H(t)</text>

    <rect x="1010" y="390" width="175" height="92" rx="7" fill="#ffffff" stroke="#3478b8" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="1035" cy="414" r="9" fill="#526f91"/>
    <text x="1055" y="420" class="label">Neuron N4</text>
    <text x="1030" y="445" class="small">mögliche innere Position</text>
    <text x="1030" y="466" class="small">A(t) · H(t)</text>

    <rect x="1010" y="545" width="175" height="92" rx="7" fill="#ffffff" stroke="#3478b8" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="1035" cy="569" r="9" fill="#526f91"/>
    <text x="1055" y="575" class="label">Neuron N5</text>
    <text x="1030" y="600" class="small">mögliche innere Position</text>
    <text x="1030" y="621" class="small">A(t) · H(t)</text>
  </g>

  <!-- local perception contract, deliberately without neuron-to-neuron edges -->
  <rect x="700" y="690" width="485" height="65" rx="6" fill="#e9f7f5" stroke="#16837a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="942" y="716" text-anchor="middle" class="small">Jedes Neuron erhält eine eigene positionsbezogene Probe</text>
  <text x="942" y="738" text-anchor="middle" class="small">aus der vollständigen abgeschlossenen Feldlage(t).</text>

  <!-- Open local function -->
  <rect x="1205" y="350" width="125" height="300" rx="6" fill="#fff8e8" stroke="#d79524" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1267" y="382" text-anchor="middle" class="label">lokale</text>
  <text x="1267" y="404" text-anchor="middle" class="label">Funktion F</text>
  <text x="1267" y="442" text-anchor="middle" class="small">Kontakt(t+1)</text>
  <text x="1267" y="464" text-anchor="middle" class="small">Eigenzustand(t)</text>
  <text x="1267" y="486" text-anchor="middle" class="small">Feldproben(t)</text>
  <line x1="1225" y1="510" x2="1310" y2="510" stroke="#d79524" stroke-width="2"/>
  <text x="1267" y="539" text-anchor="middle" class="small">A(t+1)</text>
  <text x="1267" y="561" text-anchor="middle" class="small">H(t+1)</text>
  <text x="1267" y="600" text-anchor="middle" class="small">Mechanik offen</text>
  <text x="1267" y="622" text-anchor="middle" class="small">keine Runtime-Regel</text>

  <!-- Incoming receptor lanes -->
  <path d="M355 265H390V330H420" class="flow"/>
  <path d="M355 405H420" class="flow"/>
  <path d="M355 545H390V480H420" class="flow open"/>

  <!-- Atomic timing -->
  <rect x="455" y="885" width="905" height="235" rx="8" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="485" y="925" class="section">3 · Atomare Feldzeit innerhalb jeder Neuronenschicht</text>
  <rect x="500" y="970" width="190" height="85" rx="6" fill="#ffffff" stroke="#526f91" stroke-width="2"/>
  <text x="595" y="1004" text-anchor="middle" class="label">vollständiges Feld(t)</text>
  <text x="595" y="1032" text-anchor="middle" class="small">alle A(t) und H(t)</text>
  <line x1="690" y1="1012" x2="750" y2="1012" class="flow"/>
  <rect x="760" y="970" width="255" height="85" rx="6" fill="#ffffff" stroke="#526f91" stroke-width="2"/>
  <text x="887" y="1004" text-anchor="middle" class="label">lokale Vorschläge</text>
  <text x="887" y="1032" text-anchor="middle" class="small">alle lesen denselben Takt t</text>
  <line x1="1015" y1="1012" x2="1075" y2="1012" class="flow"/>
  <rect x="1085" y="970" width="225" height="85" rx="6" fill="#e9f7f5" stroke="#16837a" stroke-width="3"/>
  <text x="1197" y="1004" text-anchor="middle" class="label">gemeinsamer Commit</text>
  <text x="1197" y="1032" text-anchor="middle" class="small">vollständiges Feld(t+1)</text>
  <text x="485" y="1092" class="body">Kein Neuron sieht einen bereits aktualisierten Nachbarn desselben Schritts.</text>

  <!-- Right: export and multimodal -->
  <rect x="1435" y="145" width="430" height="975" rx="8" fill="#ffffff" stroke="#c9d2df" stroke-width="3"/>
  <text x="1465" y="185" class="section">4 · Feldexport und Zusammenführung</text>

  <rect x="1480" y="245" width="155" height="90" rx="6" fill="#eaf2fb" stroke="#3478b8" stroke-width="3"/>
  <text x="1557" y="278" text-anchor="middle" class="label">auditives</text>
  <text x="1557" y="301" text-anchor="middle" class="label">Feldfenster</text>
  <text x="1557" y="323" text-anchor="middle" class="small">vollständige Neuronenlage</text>
  <rect x="1480" y="365" width="155" height="90" rx="6" fill="#fff5e8" stroke="#d79524" stroke-width="3"/>
  <text x="1557" y="398" text-anchor="middle" class="label">visuelles</text>
  <text x="1557" y="421" text-anchor="middle" class="label">Feldfenster</text>
  <text x="1557" y="443" text-anchor="middle" class="small">synthetisch bereit</text>
  <rect x="1480" y="485" width="155" height="90" rx="6" fill="#f4eafa" stroke="#8b53a6" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1557" y="518" text-anchor="middle" class="label">taktiles</text>
  <text x="1557" y="541" text-anchor="middle" class="label">Feldfenster</text>
  <text x="1557" y="563" text-anchor="middle" class="small">später</text>

  <path d="M1635 290H1660V530" class="wire"/>
  <path d="M1635 410H1660" class="wire"/>
  <path d="M1635 530H1660" class="wire open"/>
  <line x1="1660" y1="452" x2="1690" y2="452" class="flow"/>
  <rect x="1690" y="355" width="135" height="195" rx="7" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="1757" y="393" text-anchor="middle" class="label">MCM-</text>
  <text x="1757" y="416" text-anchor="middle" class="label">Verteiler</text>
  <text x="1757" y="452" text-anchor="middle" class="small">neutral</text>
  <text x="1757" y="474" text-anchor="middle" class="small">verlustfrei</text>
  <text x="1757" y="496" text-anchor="middle" class="small">keine Fusion</text>
  <text x="1757" y="518" text-anchor="middle" class="small">kein Memory</text>

  <line x1="1757" y1="550" x2="1757" y2="625" class="flow"/>
  <rect x="1480" y="635" width="345" height="150" rx="7" fill="#e9f7f5" stroke="#16837a" stroke-width="3"/>
  <text x="1652" y="675" text-anchor="middle" class="label">Multimodale Feldkonstellation</text>
  <text x="1652" y="711" text-anchor="middle" class="body">auditives Muster</text>
  <text x="1652" y="737" text-anchor="middle" class="body">visuelles Muster</text>
  <text x="1652" y="763" text-anchor="middle" class="body">Modalitäten bleiben unterscheidbar</text>

  <rect x="1480" y="835" width="345" height="225" rx="7" fill="#fff8e8" stroke="#d79524" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1510" y="874" class="label">Noch nicht aktive Mechanik</text>
  <text x="1510" y="910" class="body">· organische MCM-Übergangsregel</text>
  <text x="1510" y="938" class="body">· Beziehungs- und Topologiewachstum</text>
  <text x="1510" y="966" class="body">· langsame Memory-Zeitlagen</text>
  <text x="1510" y="994" class="body">· Reflexion, Handlung und Offline-Wirkung</text>
  <text x="1510" y="1032" class="small">Gestrichelt = vorbereitet oder Forschungsgrenze</text>

  <!-- Export arrow -->
  <path d="M1360 520H1400V290H1480" class="flow"/>

  <!-- Footer legend -->
  <rect x="55" y="1150" width="1810" height="45" rx="6" fill="#172033"/>
  <circle cx="90" cy="1172" r="8" fill="#16837a"/><text x="108" y="1178" class="small" fill="#ffffff">Rezeptordock</text>
  <circle cx="245" cy="1172" r="8" fill="#526f91"/><text x="263" y="1178" class="small" fill="#ffffff">mögliche innere Neuronenposition ohne Dock</text>
  <rect x="610" y="1164" width="50" height="16" rx="3" fill="none" stroke="#16837a" stroke-width="2" stroke-dasharray="7 6"/><text x="680" y="1178" class="small" fill="#ffffff">lokale Feldprobe, keine Neuronenkante</text>
  <text x="1160" y="1178" class="small" fill="#ffffff">A = Aktivierung · H = Nachhall · feste Position = technische Anatomie, keine Bedeutung</text>
</svg>
