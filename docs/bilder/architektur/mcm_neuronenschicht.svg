<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Atomare MCM-Neuronenschicht</title>
  <desc id="desc">Räumliche MCM-Neuronen nehmen den vorherigen lokalen Feldzustand wahr und werden gemeinsam fortgeschrieben.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #526077; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .node { fill: #e9f7f5; stroke: #16837a; stroke-width: 4; }
      .dock { fill: #fff4dc; stroke: #d79524; stroke-width: 3; }
      .field { stroke: #16837a; stroke-width: 3; stroke-dasharray: 8 7; opacity: 0.75; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1600" height="8" fill="#16837a"/>
  <text x="70" y="72" class="title">MCM-Neuronenschicht</text>
  <text x="70" y="108" class="subtitle">Lokale Feldwahrnehmung aus t · atomare gemeinsame Übernahme nach t+1</text>

  <rect x="70" y="165" width="1040" height="565" rx="8" fill="#ffffff" stroke="#c9d2df" stroke-width="3"/>
  <text x="100" y="205" class="label">vollständiger Feldzustand t</text>

  <line x1="300" y1="320" x2="520" y2="320" class="field"/>
  <line x1="520" y1="320" x2="740" y2="320" class="field"/>
  <line x1="740" y1="320" x2="960" y2="320" class="field"/>
  <line x1="300" y1="540" x2="520" y2="540" class="field"/>
  <line x1="520" y1="540" x2="740" y2="540" class="field"/>
  <line x1="740" y1="540" x2="960" y2="540" class="field"/>
  <line x1="300" y1="320" x2="300" y2="540" class="field"/>
  <line x1="520" y1="320" x2="520" y2="540" class="field"/>
  <line x1="740" y1="320" x2="740" y2="540" class="field"/>
  <line x1="960" y1="320" x2="960" y2="540" class="field"/>

  <g>
    <circle cx="300" cy="320" r="58" class="node"/><circle cx="520" cy="320" r="58" class="node"/>
    <circle cx="740" cy="320" r="58" class="node"/><circle cx="960" cy="320" r="58" class="node"/>
    <circle cx="300" cy="540" r="58" class="node"/><circle cx="520" cy="540" r="58" class="node"/>
    <circle cx="740" cy="540" r="58" class="node"/><circle cx="960" cy="540" r="58" class="node"/>
    <text x="300" y="326" text-anchor="middle" class="label">N</text><text x="520" y="326" text-anchor="middle" class="label">N</text>
    <text x="740" y="326" text-anchor="middle" class="label">N</text><text x="960" y="326" text-anchor="middle" class="label">N</text>
    <text x="300" y="546" text-anchor="middle" class="label">N</text><text x="520" y="546" text-anchor="middle" class="label">N</text>
    <text x="740" y="546" text-anchor="middle" class="label">N</text><text x="960" y="546" text-anchor="middle" class="label">N</text>
  </g>

  <rect x="235" y="625" width="130" height="54" rx="6" class="dock"/>
  <rect x="675" y="625" width="130" height="54" rx="6" class="dock"/>
  <text x="300" y="658" text-anchor="middle" class="body">Rezeptordock</text>
  <text x="740" y="658" text-anchor="middle" class="body">Rezeptordock</text>
  <line x1="300" y1="625" x2="300" y2="600" stroke="#d79524" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="740" y1="625" x2="740" y2="600" stroke="#d79524" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="1110" y1="445" x2="1215" y2="445" stroke="#172033" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1160" y="415" text-anchor="middle" class="body">alle Vorschläge</text>

  <rect x="1225" y="285" width="305" height="320" rx="8" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="1260" y="335" class="label">Atomare Prüfung</text>
  <text x="1260" y="380" class="body">1 · gleicher Zustand t</text>
  <text x="1260" y="418" class="body">2 · lokale Wahrnehmung</text>
  <text x="1260" y="456" class="body">3 · alle Vorschläge</text>
  <text x="1260" y="494" class="body">4 · gemeinsam gültig?</text>
  <line x1="1260" y1="525" x2="1495" y2="525" stroke="#c9d2df" stroke-width="2"/>
  <text x="1260" y="562" class="label">Schicht t+1</text>
  <text x="1260" y="590" class="body">oder vollständiger Abbruch</text>

  <rect x="70" y="775" width="1460" height="72" rx="8" fill="#ffffff" stroke="#c9d2df" stroke-width="2"/>
  <text x="100" y="819" class="body">Gestrichelte Linien = räumliche Feldwahrnehmung, keine gespeicherten Kanten oder Gewichte.</text>
</svg>
