<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCM-Neuron mit lokaler Feldwahrnehmung</title>
  <desc id="desc">Technischer Rollenplan eines lokalen MCM-Neurons ohne feste Gewichte oder Verbindungen.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
    <marker id="fieldArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16837a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #526077; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526077; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1600" height="8" fill="#16837a"/>
  <text x="70" y="72" class="title">MCM_Neuron mit Feldwahrnehmung</text>
  <text x="70" y="108" class="subtitle">Lokaler Feldteilnehmer · E0-Zustandsvertrag · keine feste Verdrahtung</text>

  <rect x="70" y="290" width="300" height="180" rx="8" fill="#fff4dc" stroke="#d79524" stroke-width="3"/>
  <text x="100" y="337" class="label">Weltkontakt</text>
  <text x="100" y="375" class="body">optionaler Rezeptordock</text>
  <text x="100" y="407" class="small">none = kein Dock</text>
  <text x="100" y="435" class="small">0 = vorhandener Nullkontakt</text>
  <line x1="370" y1="380" x2="535" y2="380" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>

  <circle cx="810" cy="390" r="245" fill="#e9f7f5" stroke="#16837a" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="810" cy="390" r="170" fill="#eaf2fb" stroke="#3478b8" stroke-width="4"/>
  <circle cx="810" cy="390" r="92" fill="#f4eafa" stroke="#8b53a6" stroke-width="4"/>
  <text x="810" y="198" class="label" text-anchor="middle">lokale Feldwahrnehmung</text>
  <text x="810" y="342" class="label" text-anchor="middle">Aktivierung</text>
  <text x="810" y="382" class="small" text-anchor="middle">gegenwärtiger Zustand</text>
  <text x="810" y="420" class="label" text-anchor="middle">Nachhall</text>
  <text x="810" y="450" class="small" text-anchor="middle">eigene schnelle Spur</text>
  <text x="810" y="610" class="small" text-anchor="middle">Identität · Feld · Position · Zeit</text>

  <circle cx="560" cy="175" r="34" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <circle cx="1030" cy="175" r="34" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <circle cx="1085" cy="610" r="34" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <circle cx="530" cy="620" r="34" fill="#ffffff" stroke="#16837a" stroke-width="3"/>
  <path d="M 584 199 C 650 250, 676 268, 700 290" fill="none" stroke="#16837a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#fieldArrow)"/>
  <path d="M 1006 199 C 950 245, 930 264, 916 290" fill="none" stroke="#16837a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#fieldArrow)"/>
  <path d="M 1053 588 C 992 554, 964 535, 944 510" fill="none" stroke="#16837a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#fieldArrow)"/>
  <path d="M 562 599 C 620 558, 648 536, 674 508" fill="none" stroke="#16837a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#fieldArrow)"/>
  <text x="470" y="130" class="small">lokale Feldprobe t-1</text>
  <text x="1000" y="130" class="small">lokale Feldprobe t-1</text>
  <text x="1095" y="665" class="small">keine Kante</text>
  <text x="410" y="680" class="small">kein Gewicht</text>

  <rect x="1225" y="290" width="305" height="180" rx="8" fill="#edf3fb" stroke="#526f91" stroke-width="3"/>
  <text x="1255" y="337" class="label">Feldzustand</text>
  <text x="1255" y="375" class="body">lokale Aktivierung</text>
  <text x="1255" y="407" class="body">lokaler Nachhall</text>
  <text x="1255" y="439" class="small">erst nach Abschluss sichtbar</text>
  <line x1="1055" y1="380" x2="1225" y2="380" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="70" y="755" width="1460" height="92" rx="8" fill="#ffffff" stroke="#c9d2df" stroke-width="2"/>
  <text x="100" y="792" class="label">Nicht eingebaut:</text>
  <text x="100" y="825" class="body">Schwelle · Spikepflicht · Synapsengewicht · feste Nachbarliste · Lernrate · Reward · Bedeutung · Ressourcenformel</text>
</svg>
